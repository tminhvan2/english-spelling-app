<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Spelling App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎧 English Spelling Dictation</h1>
            <nav>
                <button onclick="showSection('practice')">Practice</button>
                <button onclick="showSection('admin')">Admin</button>
            </nav>
        </header>

        <!-- Practice Section -->
        <section id="practice" class="section active">
            <h2>Practice Spelling</h2>
            
            <div class="exercise-selection">
                <label for="exerciseSelect">Choose an exercise:</label>
                <select id="exerciseSelect">
                    <option value="">Select an exercise</option>
                </select>
                <button onclick="loadExercise()">Load Exercise</button>
            </div>

            <div id="exerciseArea" class="exercise-area" style="display: none;">
                <div class="audio-controls">
                    <audio id="audioPlayer" controls>
                        Your browser does not support audio playback.
                    </audio>
                    <button onclick="playAudio()">▶ Play</button>
                    <button onclick="pauseAudio()">⏸ Pause</button>
                    <button onclick="replayAudio()">🔄 Replay</button>
                </div>

                <div class="spelling-input">
                    <label for="userInput">Type what you hear:</label>
                    <textarea id="userInput" rows="4" placeholder="Type your answer here..."></textarea>
                    <button onclick="checkSpelling()">Check Answer</button>
                    <button onclick="showAnswer()">Show Answer</button>
                    <button onclick="clearInput()">Clear</button>
                </div>

                <div id="result" class="result"></div>
                <div id="answer" class="answer" style="display: none;"></div>
            </div>
        </section>

        <!-- Admin Section -->
        <section id="admin" class="section">
            <h2>Admin Panel</h2>
            
            <div class="upload-section">
                <h3>Upload Files</h3>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="file">File (MP3, MP4, SRT):</label>
                        <input type="file" id="file" name="file" accept=".mp3,.mp4,.srt" required>
                    </div>
                    <div class="form-group">
                        <label for="text">Text/Transcript:</label>
                        <textarea id="text" name="text" rows="4" placeholder="Enter the text to be dictated..."></textarea>
                    </div>
                    <button type="submit">Upload File</button>
                </form>
            </div>

            <div class="files-section">
                <h3>Uploaded Files</h3>
                <div id="filesList"></div>
            </div>

            <div class="exercises-section">
                <h3>Create Exercise</h3>
                <form id="exerciseForm">
                    <div class="form-group">
                        <label for="exerciseTitle">Exercise Title:</label>
                        <input type="text" id="exerciseTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="exerciseFile">Select Audio/Video File:</label>
                        <select id="exerciseFile" required>
                            <option value="">Choose a file</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exerciseText">Text to Dictate:</label>
                        <textarea id="exerciseText" rows="4" required placeholder="Enter the text students should type..."></textarea>
                    </div>
                    <button type="submit">Create Exercise</button>
                </form>
            </div>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
